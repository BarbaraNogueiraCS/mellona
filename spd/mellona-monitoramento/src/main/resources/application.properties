# MongoDB local (container Docker, ver README). Pode ser trocado por variável de ambiente:
#   SPRING_DATA_MONGODB_URI=mongodb://outro-host:27017/mellona
spring.data.mongodb.uri=mongodb://localhost:27017/mellona
# Cria os índices declarados nas classes (@Indexed, @CompoundIndex), inclusive o único de eventId.
spring.data.mongodb.auto-index-creation=true

server.port=8080
spring.application.name=mellona-monitoramento
# Datas e horas em ISO 8601, como no contrato de eventos do ERS (13.4.1).
spring.jackson.serialization.write-dates-as-timestamps=false
